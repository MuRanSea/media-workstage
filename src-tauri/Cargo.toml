[package]
name = "media-workstage-desktop"
version = "0.1.0"
description = "Media Workstage desktop shell: runs the Go backend as a sidecar (ADR 0007)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = [] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
