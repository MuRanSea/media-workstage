<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Media Workstage</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #08090f;
        color: #94a3b8;
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #1e2130;
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      p { margin: 0; font-size: 14px; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <p>正在启动 Media Workstage…</p>
  </body>
</html>
